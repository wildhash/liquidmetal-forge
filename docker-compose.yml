version: '3.8'

services:
  # Redis for event bus
  redis:
    image: redis:7-alpine
    container_name: liquidmetal-redis
    ports:
      - "6379:6379"
    networks:
      - liquidmetal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Target service (fault-injectable)
  target:
    build:
      context: ./services/nanoforge-target
      dockerfile: Dockerfile
    container_name: liquidmetal-target
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - liquidmetal-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # Monitor service
  monitor:
    build:
      context: ./services/monitor
      dockerfile: Dockerfile
    container_name: liquidmetal-monitor
    environment:
      - TARGET_URL=http://target:3001
      - REDIS_URL=redis://redis:6379
      - POLL_INTERVAL=5000
      - STABILITY_THRESHOLD=0.7
    volumes:
      - ./data:/app/data
    networks:
      - liquidmetal-network
    depends_on:
      target:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Kestra orchestrator
  kestra:
    image: kestra/kestra:latest
    container_name: liquidmetal-kestra
    ports:
      - "8080:8080"
    environment:
      - KESTRA_CONFIGURATION=kestra.server.host=0.0.0.0
    volumes:
      - ./orchestration/kestra/flows:/app/flows
      - kestra-data:/app/data
    networks:
      - liquidmetal-network
    depends_on:
      - redis
      - target
      - monitor

  # Dashboard (Next.js)
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: liquidmetal-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_TARGET_URL=http://localhost:3001
      - NEXT_PUBLIC_MONITOR_URL=http://localhost:8080
    networks:
      - liquidmetal-network
    depends_on:
      - target
      - monitor

networks:
  liquidmetal-network:
    driver: bridge

volumes:
  kestra-data:
