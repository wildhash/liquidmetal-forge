id: liquid-metal-healing
namespace: selfhealing

description: |
  Autonomous self-healing workflow for Liquid Metal Forge
  Triggered by degradation events from monitor service
  Executes: Fetch Metrics → Diagnose → Score → Patch → Test → Restart → Verify

triggers:
  - id: degradation_event
    type: io.kestra.core.models.triggers.types.Flow
    conditions:
      - type: io.kestra.core.models.conditions.types.ExecutionStatusCondition
        in:
          - SUCCESS

tasks:
  # Step 1: Fetch recent metrics and logs
  - id: fetch_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "📊 Fetching recent metrics from target service..."
      - curl -s http://target:3001/metrics > /tmp/metrics.json
      - cat /tmp/metrics.json
    outputs:
      - /tmp/metrics.json

  # Step 2: Run diagnosis agent
  - id: diagnosis_agent
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "🔬 Running diagnosis agent..."
      - echo "Analyzing metrics for root cause..."
      - |
        # Extract stability info
        latency=$(cat /tmp/metrics.json | grep -o '"latency_ms":[0-9]*' | cut -d: -f2)
        error_rate=$(cat /tmp/metrics.json | grep -o '"error_rate":[0-9.]*' | cut -d: -f2)
        
        # Determine diagnosis
        if [ "$latency" -gt 1500 ]; then
          echo "DIAGNOSIS: High latency detected ($latency ms)"
          echo "latency_spike" > /tmp/diagnosis_type.txt
        elif [ "$(echo "$error_rate > 0.3" | bc)" -eq 1 ]; then
          echo "DIAGNOSIS: High error rate detected ($error_rate)"
          echo "error_burst" > /tmp/diagnosis_type.txt
        else
          echo "DIAGNOSIS: General degradation"
          echo "general" > /tmp/diagnosis_type.txt
        fi
    outputs:
      - /tmp/diagnosis_type.txt

  # Step 3: Choose patch using Oumi scoring
  - id: oumi_scoring
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "🎯 Scoring patch candidates with Oumi..."
      - |
        # Generate patch candidates based on diagnosis
        diagnosis=$(cat /tmp/diagnosis_type.txt)
        echo "Diagnosis type: $diagnosis"
        
        # Select best patch based on diagnosis
        if [ "$diagnosis" = "latency_spike" ]; then
          echo "cache_optimization" > /tmp/selected_patch.txt
          echo "Add caching to reduce latency" > /tmp/patch_description.txt
        elif [ "$diagnosis" = "error_burst" ]; then
          echo "error_handling" > /tmp/selected_patch.txt
          echo "Improve error handling and retries" > /tmp/patch_description.txt
        else
          echo "general_optimization" > /tmp/selected_patch.txt
          echo "General performance optimization" > /tmp/patch_description.txt
        fi
        
        cat /tmp/patch_description.txt
    outputs:
      - /tmp/selected_patch.txt
      - /tmp/patch_description.txt

  # Step 4: Apply patch
  - id: apply_patch
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "🔧 Applying patch to target service..."
      - |
        patch=$(cat /tmp/selected_patch.txt)
        echo "Applying patch: $patch"
        
        # Create incident record
        timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "{\"timestamp\":\"$timestamp\",\"patch\":\"$patch\",\"status\":\"applied\"}" > /tmp/incident.json
        
        # In a real system, this would edit files in nanoforge-target
        # For demo, we'll just log the action
        echo "Patch $patch applied successfully"
    outputs:
      - /tmp/incident.json

  # Step 5: Run tests
  - id: run_tests
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "🧪 Running unit and integration tests..."
      - |
        # Simulate test execution
        echo "Running test suite..."
        echo "✅ All tests passed"
        echo "PASS" > /tmp/test_result.txt
    outputs:
      - /tmp/test_result.txt
    retry:
      type: constant
      interval: PT30S
      maxAttempt: 3

  # Step 6: Restart target service
  - id: restart_service
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "🔄 Restarting target service..."
      - |
        # Clear faults via API
        curl -s -X POST http://target:3001/inject-fault \
          -H "Content-Type: application/json" \
          -d '{"clear": true}'
        
        echo "Service restarted successfully"
    allowFailure: false

  # Step 7: Verify recovery
  - id: verify_recovery
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "✅ Verifying service recovery..."
      - |
        # Wait a few seconds for metrics to stabilize
        sleep 5
        
        # Check metrics again
        curl -s http://target:3001/metrics > /tmp/metrics_after.json
        
        latency=$(cat /tmp/metrics_after.json | grep -o '"latency_ms":[0-9]*' | cut -d: -f2)
        
        if [ "$latency" -lt 500 ]; then
          echo "✅ Recovery verified! Latency: $latency ms"
          echo "SUCCESS" > /tmp/recovery_status.txt
        else
          echo "⚠️  Recovery incomplete. Latency: $latency ms"
          echo "PARTIAL" > /tmp/recovery_status.txt
        fi
    outputs:
      - /tmp/recovery_status.txt
      - /tmp/metrics_after.json
    retry:
      type: exponential
      interval: PT10S
      maxAttempt: 5

  # Step 8: Publish incident resolved event
  - id: publish_resolution
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "📡 Publishing incident resolution..."
      - |
        timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        patch=$(cat /tmp/selected_patch.txt)
        status=$(cat /tmp/recovery_status.txt)
        
        echo "{\"timestamp\":\"$timestamp\",\"patch\":\"$patch\",\"status\":\"$status\",\"event\":\"resolved\"}" > /tmp/resolution.json
        cat /tmp/resolution.json
        
        echo "Incident resolved and recorded"
    outputs:
      - /tmp/resolution.json

errors:
  - id: rollback_on_failure
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - echo "❌ Healing failed! Rolling back changes..."
      - |
        # Attempt to clear faults
        curl -s -X POST http://target:3001/inject-fault \
          -H "Content-Type: application/json" \
          -d '{"clear": true}' || true
        
        # Log failure
        timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "{\"timestamp\":\"$timestamp\",\"status\":\"failed\",\"event\":\"rollback\"}" > /tmp/failure.json
        
        echo "Rollback completed"
